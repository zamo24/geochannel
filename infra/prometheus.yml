global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: geochannel
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/metrics_auth_token
    static_configs:
      - targets:
          - backend:8081
