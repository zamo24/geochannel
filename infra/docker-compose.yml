services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      - PORT=8081
      - REDIS_URL=redis://redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
